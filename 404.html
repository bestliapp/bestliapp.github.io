<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestli</title>
<!-- Generic, not per-business: link-preview crawlers (iMessage, WhatsApp, Slack, …) don't run
     this page's JS, so they only ever see this static markup, never the fetched business name —
     a real per-slug preview would need server-side rendering, which a static GitHub Pages site
     can't do. Still strictly better than no preview at all. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bestli">
<meta property="og:title" content="Bestli — book an appointment">
<meta property="og:description" content="View this business's services, hours, and contact info, and book an appointment.">
<meta name="twitter:card" content="summary">
<style>
:root{--bg:#f7f5f0;--surface:#fff;--ink:#171717;--muted:#686868;--line:#e6e2da;--accent:#d97706;--soft:#fff0d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}a{color:inherit}.shell{width:min(calc(100% - 32px),760px);margin:0 auto;padding:32px 0 48px}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(25,20,10,.08);padding:32px}.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.04em}.mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.eyebrow{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--soft);color:#8a4d08;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.055em;margin:14px 0 8px}h2{font-size:19px;line-height:1.2;margin:30px 0 8px;color:#8a4d08}p{font-size:15px;line-height:1.7;color:#444}.updated,.hint{font-size:13px;color:#888}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}select{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.crosslink{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px}.btn:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:560px){.shell{width:min(calc(100% - 20px),760px);padding-top:16px}.card{padding:24px;border-radius:20px}.top{align-items:flex-start}.toolbar{align-items:flex-start}}
.stores{margin-top:18px;display:flex;flex-direction:column;gap:8px}.store{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;text-decoration:none;font-weight:700;font-size:14px}
</style>
<link rel="icon" href="/assets/bestli-logo.webp" type="image/webp"><link rel="apple-touch-icon" href="/assets/bestli-logo.webp"></head>
<body><div class="shell">
<div class="wrap">
  <div class="card" id="card">
    <div class="center" id="loading">Loading…</div>
  </div>
  <div class="brand">👋 <a href="/">Bestli</a></div>
</div>
<script>
(function () {
  // Public, publishable key — meant to be exposed client-side (same key the apps ship with).
  // Its entire security boundary is Postgres RLS / this RPC's own column list, not secrecy of
  // the key itself. get_business_by_slug never returns user_id/tax_rate/blocked_client_names —
  // see the iOS/Android READMEs' "Supabase security hardening" sections.
  var SUPABASE_URL = "https://mtkoxewhavzlyqlmbndb.supabase.co";
  var ANON_KEY = "sb_publishable_DRqOO0VxUSKQD71dFDTd5Q_RFf8Evlj";

  // Store links for people without the app. Empty until the apps are public; the buttons show
  // only for the ones that are filled in.
  var APP_STORE_URL = "";
  var PLAY_STORE_URL = "";

  var ICONS = {
    beauty: "💅", sports: "🏋️", health: "🏥", edu: "📚", home: "🏠", animals: "🐾",
    creative: "🎨", wellness: "🧘", tech: "💻", auto: "🚗", food: "🍕", cleaning: "🧹",
    events: "🎉", finance: "💼", legal: "⚖️"
  };

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function storeButtons() {
    var b = [];
    if (APP_STORE_URL) b.push('<a class="store" href="' + APP_STORE_URL + '"> Download on the App Store</a>');
    if (PLAY_STORE_URL) b.push('<a class="store" href="' + PLAY_STORE_URL + '">▶ Get it on Google Play</a>');
    return b.length ? '<div class="stores"><div class="hint">No Bestli yet? Get the free app:</div>' + b.join("") + '</div>' : "";
  }

  function notFound(card) {
    card.innerHTML =
      '<div class="center">' +
      '<div style="font-size:40px;margin-bottom:8px;">🔍</div>' +
      '<div style="font-weight:600;margin-bottom:4px;color:#1c1c1c;">Business not found</div>' +
      '<div style="font-size:13px;">This link may be out of date, or the business removed its page.</div>' +
      '</div>';
  }

  function genericNotFound(card) {
    card.innerHTML =
      '<div class="center">' +
      '<div style="font-size:40px;margin-bottom:8px;">🤔</div>' +
      '<div style="font-weight:600;color:#1c1c1c;">Page not found</div>' +
      '</div>';
  }

  var path = window.location.pathname.replace(/\/+$/, "");
  var m = path.match(/^\/biz\/([^\/]+)$/);
  var card = document.getElementById("card");

  if (!m) {
    genericNotFound(card);
    return;
  }

  var slug = decodeURIComponent(m[1]);
  var appLink = "bookli://biz/" + encodeURIComponent(slug);

  fetch(SUPABASE_URL + "/rest/v1/rpc/get_business_by_slug", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + ANON_KEY
    },
    body: JSON.stringify({ p_slug: slug })
  })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var biz = rows && rows[0];
      if (!biz) { notFound(card); return; }

      var icon = ICONS[biz.cat] || "🏢";
      var bannerHtml = biz.banner_url
        ? '<img class="banner" src="' + escapeHtml(biz.banner_url) + '" alt="">'
        : '<div class="banner">' + icon + '</div>';
      var logoHtml = biz.logo_url
        ? '<img class="logo" src="' + escapeHtml(biz.logo_url) + '" alt="">'
        : '<div class="logo">' + icon + '</div>';

      var ratingHtml = "";
      if (biz.reviews && Number(biz.reviews) > 0) {
        var n = Number(biz.reviews);
        ratingHtml = '<div class="rating">★ ' + Number(biz.rating).toFixed(1) + ' · ' + n +
          (n === 1 ? " review" : " reviews") + '</div>';
      }

      var addrHtml = biz.loc
        ? '<div class="row"><div class="ic">📍</div><div>' + escapeHtml(biz.loc) + '</div></div>'
        : "";
      var phoneHtml = biz.phone
        ? '<div class="row"><div class="ic">📞</div><a href="tel:' + escapeHtml(biz.phone) + '">' + escapeHtml(biz.phone) + '</a></div>'
        : "";
      var hoursHtml = (biz.open && biz.close)
        ? '<div class="row"><div class="ic">🕒</div><div>' + escapeHtml(biz.open) + ' – ' + escapeHtml(biz.close) + '</div></div>'
        : "";

      var services = [];
      if (Array.isArray(biz.services)) {
        services = biz.services;
      } else if (typeof biz.services === "string") {
        try { services = JSON.parse(biz.services); } catch (e) { services = []; }
      }

      var svcHtml = "";
      if (services.length) {
        svcHtml = '<div class="section-title">Services</div>' + services.slice(0, 8).map(function (s) {
          var price = (s.price != null) ? (escapeHtml(biz.currency || "") + " " + escapeHtml(s.price)) : "";
          var dur = s.duration ? (escapeHtml(s.duration) + " min") : "";
          return '<div class="svc"><div><div class="svc-name">' + escapeHtml(s.name) + '</div>' +
            (dur ? '<div class="svc-meta">' + dur + '</div>' : '') + '</div>' +
            '<div class="svc-meta">' + price + '</div></div>';
        }).join("");
      }

      document.title = biz.name + " · Bestli";

      card.innerHTML =
        bannerHtml +
        '<div class="logo-row">' + logoHtml +
        '<div><h1>' + escapeHtml(biz.name) + '</h1>' + ratingHtml + '</div></div>' +
        addrHtml + phoneHtml + hoursHtml +
        svcHtml +
        '<a class="cta" href="' + appLink + '">📱 Open in Bestli</a>' +
        '<div class="hint">Opens directly if you already have the app installed.</div>' +
        storeButtons();
    })
    .catch(function () { notFound(card); });
})();
</script>
</div></body>
</html>
